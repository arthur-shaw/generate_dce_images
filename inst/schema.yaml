# Schema for translation template structure
# Defines stable keys and nesting dimensions for each YAML section
# Single-country scope (Philippines): no country dimension anywhere

tbl_labels:
  indexed_by: [language]
  keys:
    - salary
    - hours
    - location
    - benefits
    - attribute
    - option_a
    - option_b

tbl_content:
  salary:
    indexed_by: [language]
    # lvl_0..lvl_4: hourly rate reference text (translation input)
    # monthly_format: display wrapper substituted with the computed monthly amount
    keys:
      - lvl_0
      - lvl_1
      - lvl_2
      - lvl_3
      - lvl_4
      - monthly_format

  hours:
    indexed_by: [language]
    keys:
      - lvl_0
      - lvl_1
      - lvl_2
      - lvl_3

  location:
    indexed_by: [language]
    keys:
      - lvl_0
      - lvl_1
      - lvl_2

  benefits:
    indexed_by: [language]
    keys:
      - lvl_0
      - lvl_1
      - lvl_2
      - lvl_3
