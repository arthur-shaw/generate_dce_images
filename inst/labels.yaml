# labels are structured as follows:
# first, the table stub and column labels (`tbl_labels`)
# then, the table contents (`tbl_content`)
# Philippines-only scope: no country dimension anywhere
# NOTE: tl translations below are drafts for pipeline testing, not reviewed by a native speaker

# indexed by language
tbl_labels:
  salary:
    en: "Monthly salary"
    tl: "Buwanang sahod"
  hours:
    en: "Working hours"
    tl: "Oras ng trabaho"
  location:
    en: "Location"
    tl: "Lokasyon"
  benefits:
    en: "Childcare benefits"
    tl: "Benepisyo sa pangangalaga ng bata"
  attribute:
    en: "Attribute"
    tl: "Katangian"
  option_a:
    en: "Option A"
    tl: "Opsyon A"
  option_b:
    en: "Option B"
    tl: "Opsyon B"

# indexed by language
tbl_content:
  # lvl_0..lvl_4 are hourly-rate reference text (translation input only, not rendered)
  # monthly_format is substituted with the computed monthly amount for the rendered image
  salary:
    en:
      lvl_0: "**200** PHP/hour"
      lvl_1: "**400** PHP/hour"
      lvl_2: "**600** PHP/hour"
      lvl_3: "**800** PHP/hour"
      lvl_4: "**1000** PHP/hour"
      monthly_format: "**{amount}** PHP/month"
    tl:
      lvl_0: "**200** PHP/oras"
      lvl_1: "**400** PHP/oras"
      lvl_2: "**600** PHP/oras"
      lvl_3: "**800** PHP/oras"
      lvl_4: "**1000** PHP/oras"
      monthly_format: "**{amount}** PHP/buwan"

  hours:
    en:
      lvl_0: "**Full-time** (8 hours per day)"
      lvl_1: "**Full-time** with flexible working hours"
      lvl_2: "**Part-time** (4 hours per day)"
      lvl_3: "**Part-time** with flexible working hours"
    tl:
      lvl_0: "**Full-time** (8 oras bawat araw)"
      lvl_1: "**Full-time** na may flexible na oras ng trabaho"
      lvl_2: "**Part-time** (4 oras bawat araw)"
      lvl_3: "**Part-time** na may flexible na oras ng trabaho"

  location:
    en:
      lvl_0: "**Working from home**"
      lvl_1: "**Within walking distance** from home"
      lvl_2: "**30 minutes'** drive away from home"
    tl:
      lvl_0: "Nagtatrabaho **mula sa bahay**"
      lvl_1: "**Lakad-lakad lang** ang layo mula sa bahay"
      lvl_2: "**30 minutong** pagmamaneho mula sa bahay"

  benefits:
    en:
      lvl_0: "**None**"
      lvl_1: "**High-quality** childcare center provided at the place of work"
      lvl_2: "Employer will **reimburse** expenses for childcare services or babysitting"
      lvl_3: "Employer provides a **stipend** for childcare services or babysitters"
    tl:
      lvl_0: "**Wala**"
      lvl_1: "**Mataas na kalidad** na childcare center sa lugar ng trabaho"
      lvl_2: "**Rerembolsuhin** ng employer ang gastos sa childcare o babysitting"
      lvl_3: "Magbibigay ang employer ng **stipend** para sa childcare o babysitter"
