[workspace]
authors = ["Arthur Shaw <jashaw2002@gmail.com>"]
channels = ["conda-forge"]
name = "generate_dce_images"
platforms = ["win-64"]
version = "0.1.0"

[activation.env]
# set the R library folder to where conda installs R
PIXI_R_LIBS =  "$CONDA_PREFIX/lib/R/library"
R_LIBS = "$PIXI_R_LIBS"
R_LIBS_USER = "$PIXI_R_LIBS"

[tasks]
create-excel-template = {
  cmd = "RScript create_excel_template.R",
  description = "Create an Excel template for translation"
}
validate-excel-template = {
  cmd = "RScript validate_template.R",
  description = "Validate the completed Excel translation template"
}
create-yaml-template = {
  cmd = "RScript create_yaml_template.R",
  description = "Create a YAML file from a Excel translation template"
}
generate-images = {
  cmd = "RScript generate_dce_images.R",
  description = "Generate DCE images from YAML translations"
}

[dependencies]
# project
r = "==4.5"
r-here = "==1.0.2"
r-fs = "==2.1.0"
r-purrr = "==1.2.2"
r-yaml = "==2.3.12"
r-haven = "==2.5.5"
r-dplyr = "==1.2.1"
r-assertr = "==3.0.1"
r-cli = "==3.6.6"
r-tidyr = "==1.3.2"
r-gt = "==1.3.0"
r-glue = "==1.8.1"
r-rlang = "==1.3.0"
r-stringr = "==1.6.0"
r-webshot2 = "==0.1.2"
pngquant = "==3.0.3"
# development environment
r-languageserver = "*"
r-httpgd = "*"
radian = "*"
fzf = ">=0.74.3,<0.75"
